name: Autonomous Indian Smallcap Swing Forward-Test Engine

on:
  schedule:
    # 1. Hourly Intraday GTT Circuit Guard (-12% check): Mon-Fri at 9:30, 10:30, 11:30, 12:30, 13:30, 14:30, 15:30 IST
    # (04:00, 05:00, 06:00, 07:00, 08:00, 09:00, 10:00 UTC)
    - cron: '0 4,5,6,7,8,9,10 * * 1-5'

    # 2. Daily End-of-Day (EOD) Scan & Rebalance: Mon-Fri at 4:00 PM IST (10:30 UTC)
    - cron: '30 10 * * 1-5'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode (auto, intraday, eod, status, reset, test-email)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - intraday
          - eod
          - status
          - reset
          - test-email

permissions:
  contents: write # Allows committing updated portfolio state & index.html back to repo for Vercel

jobs:
  run-forward-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Run Swing Momentum Engine Cycle
        env:
          INITIAL_CAPITAL: ${{ secrets.INITIAL_CAPITAL || 100000.0 }}
          LEVERAGE: ${{ secrets.LEVERAGE || 1.5 }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST || 'smtp.gmail.com' }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT || 587 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          echo "Executing mode: $MODE"
          python -m live_paper_trader.runner --mode "$MODE"

      - name: Commit and Push Portfolio State & Vercel Dashboard
        run: |
          git config --global user.name "Autonomous Swing Trading Bot"
          git config --global user.email "bot@swing-momentum.local"
          git add reports/paper_trading/ index.html
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(paper-trading): update portfolio state and live dashboard [skip ci]"
            git push
          fi
